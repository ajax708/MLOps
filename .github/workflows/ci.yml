name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar que la partición de datos es reproducible
        run: |
          cp data/reference/manifest.json /tmp/manifest_committed.json
          python src/prepare_data.py > /dev/null
          python - <<'EOF'
          import json
          a = json.load(open("/tmp/manifest_committed.json")); b = json.load(open("data/reference/manifest.json"))
          assert a == b, "La partición train/test/producción no es reproducible"
          print("Partición reproducible: hashes idénticos")
          EOF
      - name: Pruebas (API + data drift + concept drift)
        run: pytest -p no:warnings
      - name: Reporte de data drift
        run: python src/drift/data_drift.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen API
        run: docker build -t credit-api:${{ github.sha }} .
      - name: Build imagen MLflow
        run: docker build -t mlflow-server:3.17.2 -f docker/mlflow/Dockerfile .
      - name: Build imagen UI
        run: docker build -t credit-ui:${{ github.sha }} -f ui/Dockerfile .
