# MLflow dentro del clúster: los pods de inferencia resuelven models:/...@champion contra
# http://mlflow:5000 sin depender de procesos de la máquina anfitriona.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: mlops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
  labels: {app: mlflow}
spec:
  replicas: 1                 # SQLite + volumen RWO: una sola instancia (ver docs/architecture.md)
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: mlflow-server:3.17.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /mlflow
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 30
            periodSeconds: 15
          # 768Mi resultaba en OOMKilled (exit 137) con MLflow 3 + 2 workers: se mide y se sube.
          resources:
            requests: {cpu: 250m, memory: 2Gi}
            limits: {cpu: "1", memory: 2Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  type: NodePort
  selector: {app: mlflow}
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500          # UI en http://localhost:30500
